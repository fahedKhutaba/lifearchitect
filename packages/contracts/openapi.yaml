openapi: 3.1.0
info:
  title: LifeArchitect API
  version: 0.1.0
  description: Single source of truth between backend and web (ADR-0002). Only the Lead edits this file.
servers:
  - url: /
    description: Same origin; the base URL is set per environment
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
